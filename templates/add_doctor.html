{% extends "base.html" %}
{% block content %}
<div class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Add New Doctor</h1>
      <p class="page-subtitle">Create a new doctor profile</p>
    </div>
    <a href="/admin/doctors" class="btn btn-outline">← Back to Doctors</a>
  </div>

  <div style="max-width: 600px;">
    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Specialization</label>
            <select name="specialization_id" class="form-control">
              <option value="">Select Specialization</option>
              {% for spec in specializations %}
              <option value="{{ spec.id }}">{{ spec.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Qualification</label>
            <input type="text" name="qualification" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Experience (years)</label>
            <input type="number" name="experience" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Consultation Fee (₹)</label>
            <input type="number" name="fee" class="form-control" step="100">
          </div>
          <div class="form-group">
            <label class="form-label">Bio</label>
            <textarea name="bio" class="form-control" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Add Doctor</button>
          <a href="/admin/doctors" class="btn btn-outline">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
