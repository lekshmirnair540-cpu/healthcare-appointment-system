{% extends "base.html" %}
{% block content %}
<style>
.auth-wrap {
  min-height: calc(100vh - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
  background: var(--bg);
}
.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.auth-top {
  background: var(--navy);
  padding: 2.5rem 2.5rem 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.auth-top::before {
  content:'';
  position:absolute; top:-60px; left:50%;
  transform: translateX(-50%);
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(13,148,136,0.3) 0%, transparent 70%);
  pointer-events:none;
}
.auth-icon {
  width: 56px; height: 56px;
  background: rgba(255,255,255,0.1);
  border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.25rem;
  border: 1px solid rgba(255,255,255,0.15);
}
.auth-icon svg { width: 26px; height: 26px; }
.auth-top h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: white;
  margin-bottom: 6px;
}
.auth-top p { font-size: 14px; color: #94a3b8; }
.auth-body { padding: 2.5rem; }
.auth-footer {
  text-align: center;
  padding: 0 2.5rem 2rem;
  font-size: 14px;
  color: var(--muted);
}
.auth-footer a { color: var(--teal); text-decoration: none; font-weight: 500; }
.auth-footer a:hover { text-decoration: underline; }
.input-icon-wrap { position: relative; }
.input-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--soft);
  pointer-events: none;
}
.input-icon svg { width:16px; height:16px; }
.input-icon-wrap .form-control { padding-left: 42px; }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your HealthBook account</p>
    </div>
    <div class="auth-body">
      <form method="POST" autocomplete="on">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:15px; margin-top:4px;">
          Sign in to HealthBook
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one free →</a>
    </div>
  </div>
</div>
{% endblock %}
