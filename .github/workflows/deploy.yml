name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 3.110.127.186
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2"
            cd /home/ubuntu/healthcare-booking
            git pull origin main
            echo "Deployment successful"